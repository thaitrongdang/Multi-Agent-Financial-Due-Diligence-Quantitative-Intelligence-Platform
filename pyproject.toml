[project]
name = "financial-intelligence-platform"
version = "0.1.0"
description = "Production-grade Multi-Agent Financial Due Diligence & Quantitative Intelligence Platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "langgraph>=0.2.45",
    "langchain-core>=0.3.15",
    "langchain-openai>=0.2.6",
    "qdrant-client>=1.12.0",
    "rank-bm25>=0.2.2",
    "yfinance>=0.2.48",
    "pandas>=2.2.3",
    "numpy>=2.1.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "redis>=5.2.0",
    "langfuse>=2.53.0",
    "httpx>=0.27.2",
    "pdfplumber>=0.11.10",
]

[dependency-groups]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.3",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
